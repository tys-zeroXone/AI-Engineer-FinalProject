[tool.poetry]
name = "olist-multi-agent-ai"
version = "0.1.0"
description = "Multi-agent Generative AI system for e-commerce analytics using LangGraph, FastAPI, and Qdrant"
authors = ["Tyson Sianipar <tyson@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

fastapi = "0.122.0"
uvicorn = "0.38.0"
streamlit = "1.50.0"
requests = "2.32.5"
python-dotenv = "1.2.1"

langchain = "1.1.0"
langchain-openai = "1.1.0"
langchain-qdrant = "1.1.0"
langgraph = "1.0.4"

qdrant-client = "1.15.1"
pandas = "2.3.3"
pydantic = "2.11.7"

# 🔊 Audio transcription
openai = ">=1.0.0"

# Optional (recommended)
soundfile = ">=0.12.1"

[tool.poetry.group.dev.dependencies]
black = ">=24.0.0,<25.0.0"
isort = ">=5.13.0,<6.0.0"
flake8 = ">=7.0.0,<8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"